[project]
name = "nirikshak"
version = "0.1.0"
description = "On-device industrial defect inspection with a Llama/ExecuTorch QC assistant (Bharat AI-SoC 2026-27, PS5)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
train = ["torch", "torchvision", "onnx"]
dev = ["pytest"]

[project.scripts]
nirikshak = "nirikshak.cli:main"

[tool.setuptools.packages.find]
include = ["nirikshak*", "anvil*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
